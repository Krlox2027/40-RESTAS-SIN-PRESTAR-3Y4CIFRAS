<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aprendo a restar con el Profesor Carlos Huancaya Matos</title>
<style>
:root{font-family:'Trebuchet MS',Arial,sans-serif;color:#24375b}*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#d9f7ff,#fff0cb 55%,#ffe2ee);min-height:100vh}main{max-width:820px;margin:auto;padding:22px 16px 42px}header{text-align:center}h1{font-size:clamp(2rem,6vw,3.5rem);margin:10px 0;color:#7448b8}header p{font-size:clamp(1.15rem,3vw,1.5rem)}.card{background:white;border-radius:30px;box-shadow:0 12px 30px #40508025;padding:24px;max-width:590px;margin:20px auto;text-align:center}.top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-weight:bold;font-size:1.15rem}.bar{height:17px;background:#e6eaf1;border-radius:20px;overflow:hidden;margin:18px 0}.fill{height:100%;width:0;background:#49bc8d;transition:width .3s}.math{display:inline-grid;grid-template-columns:65px minmax(0, 310px);align-items:center;justify-content:center;margin:10px auto 16px;font-size:clamp(3rem,10vw,6rem);font-weight:900;line-height:1.12;font-variant-numeric:tabular-nums}.math .digit{text-align:right;letter-spacing:.015em}.math .minus{color:#e65b7b;text-align:left}.line{grid-column:1/3;border-top:7px solid #273d69;margin:8px 0 0}.answer{width:clamp(42px,10vw,65px);min-width:0;max-width:100%;border:5px solid #8ac8f6;border-radius:18px;text-align:center;font-size:clamp(2.3rem,8vw,3.6rem);font-weight:bold;color:#273d69;padding:5px;outline-offset:4px}.answer-row{grid-column:2;display:flex;justify-content:flex-end;gap:5px;width:100%;margin:10px 0 0}input[type="number"]::-webkit-inner-spin-button,input[type="number"]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}input[type="number"]{-moz-appearance:textfield;appearance:textfield}.answer:focus{border-color:#7952c7}.answer-row .answer{text-align:center}.prompt{font-size:1.3rem;font-weight:bold;margin:10px}button{border:0;border-radius:18px;padding:16px 24px;font-size:1.25rem;font-weight:bold;cursor:pointer;min-height:58px}button:focus-visible{outline:4px solid #222;outline-offset:3px}.primary{background:#7750d0;color:white}.next{background:#ffcb47;color:#273d69}.secondary{background:#e7eef8;color:#273d69}.buttons{display:flex;justify-content:center;flex-wrap:wrap;gap:12px;margin-top:20px}.feedback{font-size:1.35rem;font-weight:bold;min-height:38px;margin-top:16px}.success{color:#178052}.error{color:#bf3450}.stars{font-size:2rem;letter-spacing:5px}.hidden{display:none}.footer{text-align:center;font-size:1rem} @media(max-width:450px){.card{padding:18px 12px}.math{grid-template-columns:42px minmax(0, 240px)}.answer-row{width:100%}.answer{width:clamp(38px,10vw,53px);font-size:clamp(2rem,8vw,3rem);padding:2px}.answer-row{gap:4px}button{width:100%}}

#confettiCanvas{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:1000}
#reaction{position:fixed;inset:0;background:rgba(25,37,65,.35);display:flex;align-items:center;justify-content:center;z-index:1001;padding:18px}
#reaction.hidden{display:none}
.reaction-box{background:white;border-radius:30px;padding:30px 25px;text-align:center;box-shadow:0 16px 50px #14213d55;max-width:520px;width:100%}
.reaction-emoji{font-size:clamp(6rem,20vw,11rem);line-height:1.2}
.reaction-message{font-size:clamp(1.5rem,5vw,2.2rem);font-weight:900;color:#24375b;margin:12px 0}
.reaction-timer{font-size:1.15rem;color:#485a77}
</style>
</head>
<body><main><header><div class="stars" aria-hidden="true">🌟 🐻 🌈</div><h1>¡Aprendo a restar con el Profesor Carlos Huancaya Matos!</h1><p>Resuelve las restas sin llevadas. ¡Tú puedes! 🎈</p></header>
<section class="card" aria-label="Juego de restas"><div class="top"><span id="counter">Ejercicio 1 de 40</span><span id="score">⭐ Aciertos: 0</span></div><div class="bar" role="progressbar" aria-label="Progreso" aria-valuemin="0" aria-valuemax="40" aria-valuenow="0" id="progress"><div class="fill" id="fill"></div></div><div id="game"><label class="prompt" for="answerDigits">Escribe tu respuesta:</label><div class="math" aria-label="Operación"><span></span><span class="digit" id="topNumber">45</span><span class="minus">−</span><span class="digit" id="bottomNumber">23</span><div class="line"></div><div class="answer-row" id="answerDigits" role="group" aria-label="Cifras de la respuesta"></div></div><div class="buttons"><button id="check" class="primary">✓ COMPROBAR</button><button id="next" class="next hidden">SIGUIENTE ➜</button></div><p class="feedback" id="feedback" aria-live="polite"></p></div><div id="finished" class="hidden"><div style="font-size:5rem" aria-hidden="true">🏆</div><h2 style="font-size:2.2rem">¡Terminaste los 40 ejercicios!</h2><p id="finalScore" style="font-size:1.6rem"></p><button id="restart" class="primary">🔄 JUGAR OTRA VEZ</button></div></section><p class="footer">💛 Aprende a tu ritmo. Cada intento te ayuda a mejorar.</p></main><canvas id="confettiCanvas" aria-hidden="true"></canvas><div id="reaction" class="hidden" role="status" aria-live="assertive"><div class="reaction-box"><div class="reaction-emoji" id="reactionEmoji" aria-hidden="true"></div><div class="reaction-message" id="reactionMessage"></div><div class="reaction-timer" id="reactionTimer"></div></div></div>
<script>
'use strict';
const exercises=[[313,103],[321,200],[418,206],[424,101],[461,141],[483,252],[636,431],[645,541],[656,256],[694,543],[731,400],[787,135],[824,113],[824,222],[867,614],[874,403],[938,315],[946,325],[954,131],[978,178],[2446,1113],[3449,2040],[3967,1635],[4274,1071],[4368,1025],[4398,1178],[4596,1514],[4891,2660],[5448,4430],[5463,4110],[5772,4660],[6788,2040],[7137,5106],[7189,2012],[7684,5184],[7988,6741],[8174,3040],[8571,3270],[9635,7401],[9641,3141]];
// Cada computadora recibe un orden aleatorio independiente, sin servidor.
function randomInt(max){if(window.crypto?.getRandomValues){const a=new Uint32Array(1);crypto.getRandomValues(a);return a[0]%max;}return Math.floor(Math.random()*max);}
function shuffle(list){for(let i=list.length-1;i>0;i--){const j=randomInt(i+1);[list[i],list[j]]=[list[j],list[i]];}return list;}
shuffle(exercises);
let index=0,score=0,solved=false,busy=false,timeoutId=null,animationId=null;
const $=id=>document.getElementById(id);
const canvas=$('confettiCanvas'),ctx=canvas.getContext('2d');
function resizeCanvas(){const dpr=Math.min(window.devicePixelRatio||1,2);canvas.width=Math.round(innerWidth*dpr);canvas.height=Math.round(innerHeight*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);}
window.addEventListener('resize',resizeCanvas);resizeCanvas();
function confettiForThreeSeconds(){
 const colors=['#ff5277','#ffcc38','#44c6ef','#7d55d9','#54d98d','#ff8b45'];
 const pieces=Array.from({length:210},()=>({x:Math.random()*innerWidth,y:-Math.random()*innerHeight,w:5+Math.random()*9,h:8+Math.random()*12,v:2+Math.random()*4,drift:(Math.random()-.5)*3,rot:Math.random()*6.28,spin:(Math.random()-.5)*.15,color:colors[randomInt(colors.length)]}));
 const started=performance.now();
 function draw(now){ctx.clearRect(0,0,innerWidth,innerHeight);if(now-started>=3000){animationId=null;return;}
 for(const p of pieces){p.y+=p.v;p.x+=p.drift;p.rot+=p.spin;if(p.y>innerHeight+20){p.y=-20;p.x=Math.random()*innerWidth;}ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.fillStyle=p.color;ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);ctx.restore();}
 animationId=requestAnimationFrame(draw);}
 animationId=requestAnimationFrame(draw);
}
function reaction(emoji,message){$('reactionEmoji').textContent=emoji;$('reactionMessage').textContent=message;$('reactionTimer').textContent='Espera 3 segundos…';$('reaction').classList.remove('hidden');}
function hideReaction(){$('reaction').classList.add('hidden');}
function answerInputs(){return [...document.querySelectorAll('#answerDigits input')];}
function makeInputs(count){
 const holder=$('answerDigits');holder.replaceChildren();
 const names={3:['Centenas','Decenas','Unidades'],4:['Unidades de millar','Centenas','Decenas','Unidades']};
 for(let i=0;i<count;i++){
  const input=document.createElement('input');input.className='answer';input.type='text';input.inputMode='numeric';input.maxLength=1;input.autocomplete='off';input.setAttribute('aria-label',names[count][i]+' de la respuesta');input.setAttribute('aria-describedby','feedback');
  input.addEventListener('input',()=>{if(busy)return;const digits=input.value.replace(/\D/g,'');if(digits.length>1){digits.slice(0,count).split('').forEach((d,j)=>{if(i+j<count)answerInputs()[i+j].value=d;});answerInputs()[Math.min(count-1,i+digits.length-1)].focus();}else{input.value=digits;if(digits&&i<count-1)answerInputs()[i+1].focus();}});
  input.addEventListener('keydown',e=>{if(busy)return;if(e.key==='Enter'){e.preventDefault();check();}else if(e.key==='Backspace'&&!input.value&&i>0){answerInputs()[i-1].focus();}});
  input.addEventListener('paste',e=>{if(busy)return;const pasted=(e.clipboardData||window.clipboardData).getData('text').replace(/\D/g,'');if(pasted){e.preventDefault();pasted.slice(0,count-i).split('').forEach((d,j)=>answerInputs()[i+j].value=d);answerInputs()[Math.min(count-1,i+pasted.length-1)].focus();}});
  holder.append(input);
 }
}
function show(){busy=false;solved=false;const [a,b]=exercises[index];$('topNumber').textContent=a;$('bottomNumber').textContent=b;$('counter').textContent=`Ejercicio ${index+1} de ${exercises.length}`;$('score').textContent=`⭐ Aciertos: ${score}`;makeInputs(String(a).length);$('check').disabled=false;$('check').classList.remove('hidden');$('next').classList.add('hidden');$('feedback').textContent='';$('feedback').className='feedback';$('fill').style.width=`${index/exercises.length*100}%`;$('progress').setAttribute('aria-valuenow',index);answerInputs()[0].focus();}
function check(){
 if(busy||solved)return;
 const inputs=answerInputs(),raw=inputs.map(el=>el.value).join('');
 if(!new RegExp('^\\d{'+inputs.length+'}$').test(raw)){$('feedback').textContent='✏️ Escribe una cifra en cada cuadrado.';$('feedback').className='feedback error';return;}
 const correct=exercises[index][0]-exercises[index][1];busy=true;$('check').disabled=true;inputs.forEach(el=>el.disabled=true);
 if(Number(raw)===correct){solved=true;score++;$('score').textContent=`⭐ Aciertos: ${score}`;$('feedback').textContent='🎉 ¡Muy bien! ¡Respuesta correcta!';$('feedback').className='feedback success';reaction('🎉','¡Excelente! ¡Lo lograste!');confettiForThreeSeconds();timeoutId=setTimeout(()=>{hideReaction();next();},3000);
 }else{$('feedback').textContent='😢 ¡Inténtalo otra vez!';$('feedback').className='feedback error';reaction('😢','¡Inténtalo otra vez!');timeoutId=setTimeout(()=>{hideReaction();busy=false;$('check').disabled=false;inputs.forEach(el=>{el.disabled=false;el.value='';});inputs[0].focus();},3000);}
}
function next(){if(!solved)return;index++;if(index===exercises.length){$('game').classList.add('hidden');$('finished').classList.remove('hidden');$('counter').textContent='¡Completado!';$('fill').style.width='100%';$('progress').setAttribute('aria-valuenow',exercises.length);$('finalScore').textContent=`¡Respondiste correctamente ${score} de ${exercises.length} restas! 🌟`;$('restart').focus();}else show();}
$('check').addEventListener('click',check);
$('restart').addEventListener('click',()=>{if(timeoutId)clearTimeout(timeoutId);if(animationId)cancelAnimationFrame(animationId);ctx.clearRect(0,0,innerWidth,innerHeight);hideReaction();shuffle(exercises);index=0;score=0;busy=false;solved=false;$('game').classList.remove('hidden');$('finished').classList.add('hidden');show();});show();
</script></body></html>
